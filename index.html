<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Internship Week 1 Portfolio</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: #f8fafc;
            padding: 40px 20px;
            text-align: center;
            margin: 0;
        }

        h1 {
            margin-bottom: 10px;
            font-size: 36px;
        }

        p {
            color: #94a3b8;
            margin-bottom: 35px;
            font-size: 18px;
        }

        .container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
            max-width: 850px;
            margin: 0 auto;
        }

        a {
            background: #3b82f6;
            color: white;
            padding: 18px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            transition: 0.2s;
        }

        a:hover {
            background: #2563eb;
            transform: translateY(-2px);
        }

        .github {
            display: inline-block;
            margin-top: 30px;
            background: #334155;
        }

        .github:hover {
            background: #475569;
        }
    </style>
</head>
